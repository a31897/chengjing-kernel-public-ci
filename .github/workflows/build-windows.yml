name: Experimental Windows Kernel - Checkpointed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-windows.yml
      - .github/workflows/windows-slice.yml
      - source-bundle.zip
      - source-bundle.sha256

permissions:
  contents: read

concurrency:
  group: chengjing-kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  slice1:
    uses: ./.github/workflows/windows-slice.yml
    with:
      slice: 1
  slice2:
    needs: slice1
    if: ${{ needs.slice1.outputs.state == 'checkpoint' && needs.slice1.outputs.cache_saved == 'true' }}
    uses: ./.github/workflows/windows-slice.yml
    with:
      slice: 2
  slice3:
    needs: slice2
    if: ${{ needs.slice2.outputs.state == 'checkpoint' && needs.slice2.outputs.cache_saved == 'true' }}
    uses: ./.github/workflows/windows-slice.yml
    with:
      slice: 3
